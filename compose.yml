services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "5440:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: admitidos
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d admitidos" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
