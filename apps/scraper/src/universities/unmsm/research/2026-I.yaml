# ── Min score rule history (cross-process, for context) ───────────────────────
min_score_history:
  "2024-I":
    rule: "puntaje mínimo = 900 pts"
    source: "Art. 33 del reglamento"
    confirmed: true
  "2024-II":
    rule: "puntaje mínimo = 900 pts"
    source: "reglamento"
    confirmed: true
  "2025-I":
    rule: "puntaje aprobatorio"
    source: "reglamento (sección calificación)"
    note: "No specific threshold; implies any non-negative total"
    confirmed: true
  "2025-II":
    rule: "puntaje positivo"
    source: "reglamento"
    note: "Explicitly positive (> 0)"
    confirmed: true
  "2026-I":
    rule: "estricto orden de mérito (no qualifier)"
    source: "Art. 29 del reglamento"
    note: "No minimum score stated. News sources reported 900 reinstated — unconfirmed."
    confirmed: false

# ── Segunda opción history (cross-process, for context) ───────────────────────
segunda_opcion_history:
  "2024-I":
    active: true
    rule: "Postulante puede inscribirse en 2 EPs de la misma área"
    source: "Art. 23 del reglamento"
    observation_values: ["ALCANZO VACANTE PRIMERA OPCIÓN", "ALCANZO VACANTE SEGUNDA OPCIÓN"]
  "2024-II":
    active: true
    source: "reglamento"
    observation_values: ["ALCANZO VACANTE PRIMERA OPCIÓN", "ALCANZO VACANTE SEGUNDA OPCIÓN"]
  "2025-I":
    active: false
  "2025-II":
    active: false
  "2026-I":
    active: false
    source: "Art. 14: 'El postulante se inscribirá solamente en una Escuela Profesional'"
    csv_confirmed: true            # Zero SEGUNDA OPCIÓN observations in scraped data

# ── Notes ─────────────────────────────────────────────────────────────────────
notes: |
  2026-I is the FIRST STAGE of the 2026 admission year (Art. 3).
  It covers only EBR/EBA and Centro Preuniversitario de la UNMSM.
  All other modalities (C, D, E, F, G, H, I, J, M, N, O) are included in
  the separate 2026-II process. Both stages begin classes in Semester 2026-I.

  The exam structure (20H + 70C + 10A = 100) has been stable since 2025-I.
  2024-I used a different structure (25H + 65C + 10A) and 2024-II dropped
  actitudinal entirely (30H + 70C = 100).

  The 900-point minimum score was explicit in 2024-I and 2024-II reglamentos.
  It was replaced by "puntaje aprobatorio" in 2025-I and "puntaje positivo"
  in 2025-II. For 2026-I the reglamento simply says "estricto orden de mérito"
  with no qualifier, suggesting the threshold was not reinstated officially
  despite what some news sources reported.

  The portal uses the new (2026-I+) format: names and programs are Base64-encoded
  in data-auth attributes, admitted rows have class="table-success", observation
  value is "ALCANZÓ VACANTE" (with accent, unlike older "ALCANZO VACANTE").
