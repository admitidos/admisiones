# Research file — UNMSM Proceso de Admisión 2026-I
# Sources:
#   [✓] Reglamento de Admisión 2026-I UNMSM.pdf (official, authoritative)
#   [~] News sources: Infobae, Lumbreras — corroborated, not primary
#   [✓] CSV data: 26,518 rows, 2,772 admitted (scraped from portal)

process_id: "2026-I"
university: "UNMSM"

# ── Flags ────────────────────────────────────────────────────────────────────
# These map directly to the Prisma Process model fields.
flags:
  has_areas: true                    # [✓] 5 áreas académico-profesionales (Art. 1)
  area_count: 5
  has_modalities: false              # [✓] Only EBR/EBA + CEPUNMSM; NO special modalities in 2026-I
  has_min_score_filter: false        # [✓] Reglamento only says "estricto orden de mérito" (Art. 29)
                                     #     No "puntaje mínimo = 900" stated (compare: 2024-I/II had it explicitly)
                                     #     News sources claimed 900 was reinstated — NOT confirmed in official text
  min_score_threshold: null          # N/A (no filter in reglamento)
  min_score_hides_from_portal: false # [✓] Verified from CSV: 18,336 rows with score < 900 appear in portal
  has_segunda_opcion: false          # [✓] Art. 14: "El postulante se inscribirá solamente en una EP"
                                     #     CSV confirms: zero SEGUNDA OPCIÓN observation values
  session_count: 1                   # Each applicant takes one exam in one sitting (no UNI-style multi-session)
  is_partial_process: true           # [✓] Art. 3: 2026-I = first stage (EBR+CEPUNMSM only)
                                     #     2026-II = second stage (all remaining modalities)
                                     #     Both stages start in the same academic period: Semester 2026-I

# ── Portal modality codes scraped ────────────────────────────────────────────
portal_modality_codes: ["A"]         # Modality A = EBR/EBA (CEPUNMSM admitted through merit ranking, no exam)

# ── Exam structure ────────────────────────────────────────────────────────────
# Source: Art. 20–21 and Anexo 5 of reglamento
exam:
  name: "Prueba General de Admisión (DECO®)"
  total_questions: 100
  duration_hours: 3

  sections:
    actitudinal:
      count: 10
      purpose: "Competencias profesionales transversales"
      no_negative_score: true        # [✓] Art. 28: "no tendrá puntaje negativo o en contra"
    habilidades:
      count: 20
      breakdown:
        verbal: 10                   # Comprensión lectora
        logico_matematica: 10
    conocimientos:
      count: 70
      note: "Distribución por área según Anexo 5"

  scoring:
    correct_pts: 20.0
    incorrect_pts: -1.125
    blank_or_multiple_pts: 0.0
    actitudinal_can_be_negative: false

  # Structural change note (useful for cross-process comparison):
  # 2024-I:  25H + 65C + 10A (3 sections)
  # 2024-II: 30H + 70C       (2 sections — no actitudinal)
  # 2025-I:  20H + 70C + 10A (3 sections — actitudinal re-ordered to first)
  # 2025-II: 20H + 70C + 10A (same)
  # 2026-I:  20H + 70C + 10A (same — structure stabilized since 2025-I)

# ── Jornadas (exam days per area) ─────────────────────────────────────────────
# Source: Anexo 2 (Cronograma) of reglamento
# Each applicant attends ONE jornada based on their area.
