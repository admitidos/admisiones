  max_score: 1598.625
  min_admitted_score: 353.625       # From special modality; modality A min = 900+

# ── Notes ─────────────────────────────────────────────────────────────────────
notes: |
  2024-II is the second (full) stage of the 2024 admission year, covering all
  modalities. It was the last process to use segunda opción.

  Key structural difference from 2024-I and 2025-I:
  - The GENERAL exam (modality A) has NO actitudinal section: 30H + 70C = 100
    (2024-I had 25H + 65C + 10A, and 2025-I+ reverted to 3 sections with actitudinal)
  - The SPECIAL exam is 80 questions (30H + 50C), not 100

  The 900-pt minimum applied only to the general exam (modalities A and C). Special
  modality applicants (D, E, F, H, I) could be admitted with scores far below 900
  because the special exam is structurally different — its max score is 80 × 20 = 1,600
  points and competitive pressure is lower (dedicated seats, no merit competition
  against EBR/EBA applicants).

  2024-II was the last process to have segunda opción: 549 rows show SEGUNDA OPCIÓN
  observation. Starting from 2025-I, applicants can only register for ONE EP per
  Art. 14 of the new reglamento.

  Portal used the old HTML format (plain-text <td> cells, no Base64 encoding).
  Special modalities discovered dynamically from Website20242/ root.
