  H:  {admitted: 9,    admitted_below_900: 9,  note: "Special exam — filter NOT enforced"}
  I:  {admitted: 4,    admitted_below_900: 4,  note: "Special exam — filter NOT enforced"}
  J:  {admitted: 0,    admitted_below_900: 0}
  M:  {admitted: 0,    admitted_below_900: 0}
  N:  {admitted: 2,    admitted_below_900: 0}
